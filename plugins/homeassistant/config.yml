# Home Assistant Plugin Configuration
#
# This file contains non-secret configuration for the Home Assistant plugin.
# Secrets (HA_TOKEN) are stored in backend/.env
# Plugin orchestration (enabled, events, condition) is in config/plugins.yml

# Home Assistant server configuration
ha_url: ${HA_URL}
ha_token: ${HA_TOKEN}

# Command configuration
wake_word: ${HA_WAKE_WORD:-hermes}
timeout: ${HA_TIMEOUT:-30}

# Button action mappings
# Maps device button events to Home Assistant service calls.
# Each key is a button event type (single_press, double_press).
# Values specify: service, target_type (area/entity), target, entity_type.
button_actions:
  double_press:
    service: toggle
    target_type: area
    target: hall
    entity_type: light
