default_install_hook_types: [pre-commit, pre-push]

repos:
  # Code style rules that are Chronicle-specific (AGENTS.md → Code Style)
  - repo: local
    hooks:
      - id: import-placement
        name: imports at top of file (or explained)
        entry: python3 scripts/check_import_placement.py
        language: system
        types: [python]
        exclude: \.venv/
        stages: [pre-commit, pre-push]

  # Code formatting
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        name: black (default projects)
        language_version: python3.12
        exclude: (\.venv/|^extras/wakeword-service/)
      - id: black
        name: black (wakeword service)
        args: ["--config", "extras/wakeword-service/pyproject.toml"]
        language_version: python3.12
        files: ^extras/wakeword-service/
        exclude: \.venv/
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (default projects)
        args:
          [
            "--profile",
            "black",
            "-p",
            "simple_speaker_recognition",
          ]
        exclude: (\.venv/|^extras/wakeword-service/)
      - id: isort
        name: isort (wakeword service)
        args: ["--settings-path", "extras/wakeword-service/pyproject.toml"]
        files: ^extras/wakeword-service/
        exclude: \.venv/

  # File hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: \.venv/
      - id: end-of-file-fixer
        exclude: \.venv/
