services:
  chronicle-backend:
    image: ${CHRONICLE_REGISTRY:-}chronicle-backend:${CHRONICLE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: prod  # Use prod stage without test dependencies
      args:
        # git describe of the checkout (exported by services.py before builds;
        # CI sets it to the release tag) — reported by the /version endpoint.
        CHRONICLE_BUILD_VERSION: ${CHRONICLE_BUILD_VERSION:-dev}
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src  # Mount source code for development
      - ./benchmark:/app/benchmark  # LongMemEval benchmark harness (Phase A+)
      - ./data/audio_chunks:/app/audio_chunks
      - ./data/debug_dir:/app/debug_dir
      - ./data:/app/data
      - ../../config:/app/config  # Mount entire config directory (includes config.yml, defaults.yml, plugins.yml)
      - ../../plugins:/app/plugins  # External plugins directory
      - ../../discovery.py:/app/discovery.py:ro  # Service discovery module
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro  # Tailscale socket for minidisc
      # Codex CLI auth for the optional codex memory-agent executor. The wizard points
      # CODEX_HOME_DIR at the host's ~/.codex; rw because codex rotates its tokens.
      - ${CODEX_HOME_DIR:-./data/codex-home}:/codex-home
    environment:
      - CODEX_HOME=/codex-home
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - PARAKEET_ASR_URL=${PARAKEET_ASR_URL}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - HF_TOKEN=${HF_TOKEN}
      - SPEAKER_SERVICE_URL=${SPEAKER_SERVICE_URL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HA_TOKEN=${HA_TOKEN}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:8000,http://192.168.1.153:5173,http://192.168.1.153:8000,https://localhost:5173,https://localhost:8000,https://100.105.225.45,https://localhost
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URI=mongodb://mongo:27017
      # Vault sync broker -> server Syncthing REST API (internal docker network)
      - VAULT_SYNC_SYNCTHING_URL=http://vault-syncthing:8384
      - VAULT_SYNC_API_KEY=${VAULT_SYNC_API_KEY:-}
      - VAULT_SYNC_ADDRESS=${VAULT_SYNC_ADDRESS:-}
      # Wake-word data-collection proxy -> standalone wakeword-service (chronicle-network)
      - WAKEWORD_SERVICE_URL=${WAKEWORD_SERVICE_URL:-http://chronicle-wakeword-service:8770}
      # TTS service (kitten/etc) for spoken replies on the device. Empty → the backend
      # discovers chronicle-tts on the Tailnet (set explicitly by the wizard for a
      # local/own/pinned endpoint).
      - CHRONICLE_TTS_URL=${CHRONICLE_TTS_URL:-}
      # Host service-manager agent (start/stop services from the WebUI).
      # Token comes from .env via env_file (auto-generated by services.py).
      - SERVICE_MANAGER_URL=${SERVICE_MANAGER_URL:-http://host.docker.internal:8775}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Access host's Tailscale network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readiness"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Unified Worker Container
  # No CUDA needed for chronicle-backend and workers, workers only orchestrate jobs and call external services
  # Runs all workers in a single container for efficiency:
  # - 6 RQ workers (transcription, memory, default queues)
  # - 1 Audio persistence worker (audio queue)
  # - 1+ Stream workers (conditional based on config.yml - Deepgram/Parakeet)
  # Uses Python orchestrator for process management, health monitoring, and self-healing
  workers:
    image: ${CHRONICLE_REGISTRY:-}chronicle-backend:${CHRONICLE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: prod  # Use prod stage without test dependencies
      args:
        # Must match chronicle-backend's build args (same image tag).
        CHRONICLE_BUILD_VERSION: ${CHRONICLE_BUILD_VERSION:-dev}
    command: ["python", "worker_orchestrator.py"]
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./worker_orchestrator.py:/app/worker_orchestrator.py
      - ./worker_healthcheck.py:/app/worker_healthcheck.py  # Container healthcheck probe
      - ./data/audio_chunks:/app/audio_chunks
      - ./data:/app/data
      - ../../config:/app/config  # Mount entire config directory (includes config.yml, defaults.yml, plugins.yml)
      - ../../plugins:/app/plugins  # External plugins directory
      - ../../discovery.py:/app/discovery.py:ro  # Service discovery module
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro  # Tailscale socket for minidisc
      # Codex CLI auth for the optional codex memory-agent executor (memory jobs run here).
      - ${CODEX_HOME_DIR:-./data/codex-home}:/codex-home
    environment:
      - CODEX_HOME=/codex-home
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - PARAKEET_ASR_URL=${PARAKEET_ASR_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - HA_TOKEN=${HA_TOKEN}
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URI=mongodb://mongo:27017
      # Worker orchestrator configuration (optional - defaults shown)
      - WORKER_CHECK_INTERVAL=${WORKER_CHECK_INTERVAL:-10}
      - MIN_RQ_WORKERS=${MIN_RQ_WORKERS:-6}
      - WORKER_STARTUP_GRACE_PERIOD=${WORKER_STARTUP_GRACE_PERIOD:-30}
      - WORKER_SHUTDOWN_TIMEOUT=${WORKER_SHUTDOWN_TIMEOUT:-30}
      # TTS service (kitten/etc) for spoken replies on the device — dispatcher runs here.
      # Empty → discover chronicle-tts on the Tailnet (wizard sets it for local/pinned).
      - CHRONICLE_TTS_URL=${CHRONICLE_TTS_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Access host services
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped
    # Probe the actual work, not just the process: fails if the RQ worker fleet
    # shrank below MIN_RQ_WORKERS or a stream-consumer heartbeat went stale
    # (wedged-but-alive). start_period covers orchestrator startup + worker boot.
    healthcheck:
      test: ["CMD", "python", "worker_healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  # Annotation Cron Scheduler
  # Runs periodic jobs for AI-powered annotation suggestions:
  # - Daily: Surface potential errors in transcripts/memories
  # - Weekly: Fine-tune error detection models using user feedback
  # Set DEV_MODE=true in .env for 1-minute intervals (testing)
  annotation-cron:
    image: ${CHRONICLE_REGISTRY:-}chronicle-backend:${CHRONICLE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
      args:
        # Must match chronicle-backend's build args (same image tag).
        CHRONICLE_BUILD_VERSION: ${CHRONICLE_BUILD_VERSION:-dev}
    command: ["python", "-m", "advanced_omi_backend.cron"]
    container_name: chronicle-annotation-cron
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - DEV_MODE=${DEV_MODE:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - annotation  # Optional profile - enable with: docker compose --profile annotation up

  # Lightweight intent-router microservice: classifies a voice command as a
  # home-automation request vs a general agent/chat query (sub-ms Model2Vec +
  # logreg). Kept out of the backend image so the ML deps don't bloat it. The
  # Home Assistant plugin calls it at http://intent-router:8791/classify.
  intent-router:
    build:
      context: ../../extras/intent-router
      dockerfile: Dockerfile
    image: chronicle-intent-router:latest
    container_name: chronicle-intent-router
    volumes:
      - ../../extras/intent-router:/app  # live code + retrained classifier (no rebuild)
    environment:
      - INTENT_ROUTER_PORT=8791
      - ROUTER_HOME_THRESHOLD=${ROUTER_HOME_THRESHOLD:-0.5}
      - HF_HOME=/opt/hf
      - HF_HUB_OFFLINE=1
    ports:
      - "8791:8791"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8791/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  # Caddy reverse proxy - provides HTTPS for microphone access
  # Access at: https://localhost (accepts self-signed cert warning)
  # Only starts when HTTPS is configured (Caddyfile exists)
  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
      - "80:80"  # HTTP redirect to HTTPS
      - "3443:3443"  # Langfuse HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ../../certs:/certs:ro
    depends_on:
      chronicle-backend:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - https

  # WebUI with hot reload — source is volume-mounted, changes appear instantly
  # without rebuilds. This is the only webui (home use); served on :5173 and
  # fronted by Caddy for HTTPS.
  webui-dev:
    build:
      context: ./webui
      dockerfile: Dockerfile.dev
    ports:
      - "${WEBUI_DEV_PORT:-5173}:5173"
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL-http://${HOST_IP}:${BACKEND_PUBLIC_PORT:-8000}}
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-localhost 127.0.0.1}
      - VITE_HMR_PORT=${VITE_HMR_PORT:-5173}
    volumes:
      - ./webui/src:/app/src
      - ./webui/public:/app/public
      - ./webui/tailwind.config.js:/app/tailwind.config.js:ro
      - ./webui/chronicle-espresso-preset.js:/app/chronicle-espresso-preset.js:ro
    depends_on:
      chronicle-backend:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:8.0.14
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"  # Avoid conflict with dev on 6379
    volumes:
      - ./data/redis_data:/data
    # Redis is the raw-audio WAL. ACK XADD only after the append is fsynced so a
    # host crash cannot erase the last second of already-accepted audio.
    command: redis-server --appendonly yes --appendfsync always
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Vault sync - Syncthing instance that shares each user's Obsidian vault
  # (data/conversation_docs/{user_id}) with their Mac so it can be opened in Obsidian.
  # Configured exclusively by the backend's /api/vault-sync broker - not by hand.
  # REST API stays on the internal docker network (reachable as vault-syncthing:8384);
  # only the sync protocol port 22000 is published (reach it over Tailscale).
  # Enable with: docker compose --profile vault-sync up -d
  vault-syncthing:
    image: syncthing/syncthing:latest
    container_name: chronicle-vault-syncthing
    hostname: chronicle-vault-syncthing
    environment:
      - STGUIADDRESS=0.0.0.0:8384          # REST API reachable from the backend container
      - STGUIAPIKEY=${VAULT_SYNC_API_KEY}  # backend authenticates to Syncthing with this
      - PUID=${VAULT_SYNC_PUID:-0}         # match conversation_docs file ownership
      - PGID=${VAULT_SYNC_PGID:-0}
    volumes:
      - ./data/syncthing_config:/var/syncthing/config
      - ./data/conversation_docs:/vaults   # backend exposes per-user folders under here
    ports:
      - "22000:22000/tcp"   # sync protocol (reachable via Tailscale)
      - "22000:22000/udp"   # QUIC
      - "21027:21027/udp"   # local network discovery
    restart: unless-stopped
    profiles:
      - vault-sync

  tailscale:
    image: tailscale/tailscale:latest
    container_name: advanced-tailscale
    hostname: chronicle-tailscale
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ACCEPT_DNS=true
    volumes:
      - tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    profiles:
      - tailscale  # Optional profile
    command: >
      sh -c "tailscaled &
             tailscale up --authkey=$${TS_AUTHKEY} --accept-dns=true &&
             sleep infinity"

  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
