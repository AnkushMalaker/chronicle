services:
  llama-cpp-llm:
    # Pin the day-zero Qwen3.8-capable upstream revision so a mutable image tag
    # cannot silently change the production inference runtime.
    image: localhost/chronicle-llama-cpp:qwen3.8-6b4344e
    build:
      context: https://github.com/ggml-org/llama.cpp.git#6b4344ecc7e6a493daba9681991852eb06bb3b33
      dockerfile: .devops/cuda.Dockerfile
      target: server
      args:
        APP_VERSION: qwen3.8-6b4344e
        APP_REVISION: 6b4344ecc7e6a493daba9681991852eb06bb3b33
        # Default to RTX 4090/Ada (compute capability 8.9), but keep other
        # deployment GPUs configurable without editing this checked-in file.
        CUDA_DOCKER_ARCH: "${CUDA_DOCKER_ARCH:-89}"
    ports:
      # Loopback is the safe default. Same-host Chronicle containers reach this
      # service directly as llama-cpp-llm:8080 on chronicle-network.
      - "${LLM_BIND_HOST:-127.0.0.1}:${LLM_PORT:-8083}:8080"
    volumes:
      - ./models:/models:ro
      - ${LLM_CACHE_DIR:-./cache}:/cache
    environment:
      # HF download mode vs local-file mode are mutually exclusive: passing both
      # --hf-repo and --model makes llama.cpp use the model basename as the file to
      # pick from the repo (ignoring the :quant tag), which fails. So the entrypoint
      # passes --model ONLY when LLM_HF_REPO is empty; otherwise llama.cpp downloads
      # + caches the GGUF from HuggingFace via LLAMA_ARG_HF_REPO.
      LLAMA_ARG_HF_REPO: ${LLM_HF_REPO:-}
      LLAMA_ARG_HF_FILE: ${LLM_HF_FILE:-}
      LLM_MODEL_PATH: /models/${LLM_MODEL_FILE:-model.gguf}
      LLAMA_CACHE: /cache
      HF_TOKEN: ${HF_TOKEN:-}
      # Optional application auth. If set, configure the same LLAMA_API_KEY in
      # the backend environment; config/defaults.yml forwards it to the client.
      LLAMA_API_KEY: ${LLAMA_API_KEY:-}
      LLAMA_ARG_CTX_SIZE: ${CTX_SIZE:-8192}
      LLAMA_ARG_N_GPU_LAYERS: ${N_GPU_LAYERS:--1}
      LLAMA_ARG_N_PARALLEL: ${LLAMA_ARG_N_PARALLEL:-1}
      LLAMA_ARG_FLASH_ATTN: ${LLAMA_ARG_FLASH_ATTN:-auto}
      LLAMA_ARG_JINJA: ${LLAMA_ARG_JINJA:-true}
      LLAMA_ARG_CACHE_TYPE_K: ${LLAMA_ARG_CACHE_TYPE_K:-f16}
      LLAMA_ARG_CACHE_TYPE_V: ${LLAMA_ARG_CACHE_TYPE_V:-f16}
      LLAMA_ARG_MMPROJ_AUTO: ${LLAMA_ARG_MMPROJ_AUTO:-true}
      LLAMA_ARG_REASONING: ${LLAMA_ARG_REASONING:-auto}
      # `--reasoning-budget`: -1 is llama.cpp's unrestricted default. Bound it for a
      # thinking model so a runaway trace cannot eat the context the caller needs.
      LLAMA_ARG_THINK_BUDGET: ${LLAMA_ARG_THINK_BUDGET:--1}
      LLAMA_ARG_SPEC_TYPE: ${LLAMA_ARG_SPEC_TYPE:-none}
      LLAMA_ARG_SPEC_DRAFT_MODEL: ${LLAMA_ARG_SPEC_DRAFT_MODEL:-}
      LLAMA_ARG_SPEC_DRAFT_N_MAX: ${LLAMA_ARG_SPEC_DRAFT_N_MAX:-3}
      LLAMA_ARG_FIT: ${LLAMA_ARG_FIT:-on}
      LLAMA_DRAFT_MODEL_URL: ${LLAMA_DRAFT_MODEL_URL:-}
      LLAMA_ARG_HOST: "0.0.0.0"
    entrypoint:
      - /bin/sh
      - -c
      - 'if [ -n "$$LLAMA_DRAFT_MODEL_URL" ] && [ ! -s "$$LLAMA_ARG_SPEC_DRAFT_MODEL" ]; then curl --fail --location --retry 5 --output "$$LLAMA_ARG_SPEC_DRAFT_MODEL.part" "$$LLAMA_DRAFT_MODEL_URL" && mv "$$LLAMA_ARG_SPEC_DRAFT_MODEL.part" "$$LLAMA_ARG_SPEC_DRAFT_MODEL"; fi; if [ -n "$$LLAMA_ARG_HF_REPO" ]; then exec /app/llama-server; else exec /app/llama-server --model "$$LLM_MODEL_PATH"; fi'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - chronicle-network

  llama-cpp-embed:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10290
    ports:
      - "${EMBED_BIND_HOST:-127.0.0.1}:${EMBED_PORT:-8082}:8080"
    volumes:
      - ./models:/models:ro
      - ./cache:/cache
    environment:
      # See llama-cpp-llm above: --hf-repo and --model are mutually exclusive, so the
      # entrypoint passes --model ONLY when EMBED_HF_REPO is empty.
      LLAMA_ARG_HF_REPO: ${EMBED_HF_REPO:-}
      LLM_MODEL_PATH: /models/${EMBED_MODEL_FILE:-embed-model.gguf}
      LLAMA_CACHE: /cache
      HF_TOKEN: ${HF_TOKEN:-}
      LLAMA_API_KEY: ${LLAMA_API_KEY:-}
      LLAMA_ARG_CTX_SIZE: ${EMBED_CTX_SIZE:-2048}
      LLAMA_ARG_N_GPU_LAYERS: ${N_GPU_LAYERS:--1}
      LLAMA_ARG_EMBEDDINGS: "true"
      LLAMA_ARG_HOST: "0.0.0.0"
    entrypoint:
      - /bin/sh
      - -c
      - 'if [ -n "$$LLAMA_ARG_HF_REPO" ]; then exec /app/llama-server; else exec /app/llama-server --model "$$LLM_MODEL_PATH"; fi'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - chronicle-network

  # Edge agent sidecar — advertises this service on the Tailnet
  edge-agent:
    build:
      context: ../../edge
    network_mode: host
    environment:
      - ADVERTISE=chronicle-llm:8083
    volumes:
      - /var/run/tailscale:/var/run/tailscale:ro
    restart: unless-stopped
    profiles:
      - edge

networks:
  chronicle-network:
    external: true
