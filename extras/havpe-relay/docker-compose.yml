services:
  havpe-relay:
    image: ${CHRONICLE_REGISTRY:-}chronicle-havpe-relay:${CHRONICLE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    env_file: .env
    environment:
      - TCP_PORT=${TCP_PORT:-8989}
      - DEBUG=${DEBUG:-0}
    restart: unless-stopped
    command: ["uv", "run", "python3", "main.py", "-v",
              "--backend-url", "${BACKEND_URL:-http://host.docker.internal:8000}",
              "--backend-ws-url", "${BACKEND_WS_URL:-ws://host.docker.internal:8000}"]
    volumes:
      - ./audio_chunks:/app/audio_chunks

  # Edge agent sidecar — advertises this service on the Tailnet
  edge-agent:
    build:
      context: ../../edge
    network_mode: host
    environment:
      - ADVERTISE=chronicle-relay:8989
    volumes:
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro
    restart: unless-stopped
    profiles:
      - edge
