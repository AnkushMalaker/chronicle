[project]
name = "chronicle-tray"
version = "0.1.0"
description = "Unified Chronicle desktop tray: vault sync, ScreenPipe, pendant streaming"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.8.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "minidisc-python>=0.1.0",
]

# Pendant (BLE wearable) streaming is opt-in: data-only client nodes shouldn't
# pull the BLE/audio stack. Install with: chronicle-tray install --pendant
[project.optional-dependencies]
pendant = [
    "friend-lite-sdk",
    "easy_audio_interfaces>=0.8",
    "websockets",
    "pyyaml",
    "bleak",
]

[project.scripts]
chronicle-tray = "chronicle_tray.cli:main"

[tool.uv.sources]
friend-lite-sdk = { path = "../friend-lite-sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chronicle_tray"]
