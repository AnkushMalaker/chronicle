[project]
name = "asr-services"
version = "0.2.0"
description = "Provider-based ASR services for Chronicle"
requires-python = ">=3.10"

dependencies = [
  "pydantic>=2.0.0",
  "numpy>=1.26",
  "soundfile>=0.12",
  "fastapi>=0.115.12",
  "uvicorn>=0.34.2",
  "python-multipart>=0.0.6",
  "httpx>=0.28.1",
]

[project.optional-dependencies]
# Optional dependencies for specific use cases
local-audio = [
    "easy-audio-interfaces[local-audio]>=0.7.1",
]

wyoming = [
    "websockets>=12.0",
    "wyoming>=1.7.0",
    "easy-audio-interfaces>=0.7.1",
    "silero-vad>=5.1.2",
]

# CUDA versions for PyTorch
cu126 = [
  "torch>=2.3",
  "torchaudio>=2.3",
]

cu128 = [
  "torch>=2.3",
  "torchaudio>=2.3",
]

# AMD Strix Halo (gfx1151) - torch/torchaudio are installed via pip in the Dockerfile
# using the ROCm nightly index (rocm.nightlies.amd.com/v2/gfx1151/) because uv cannot
# resolve rocm[libraries] from source dist. Mark them as never-selected so uv won't
# try to resolve torch>=2.10 (not yet on PyPI) when generating the lockfile.
strixhalo = [
  "torch>=2.10; sys_platform == 'never'",
  "torchaudio>=2.10; sys_platform == 'never'",
]

[tool.uv]
compile-bytecode = true
conflicts = [
  [
    { group = "faster-whisper" },
    { group = "transformers" },
    { group = "nemo" },
    { group = "nemo-rocm" },
    { group = "vibevoice" },
    { group = "qwen3-asr" },
    { group = "qwen3-asr-full" },
    { group = "gemma4" },
    { group = "af-next" },
    { group = "granite" },
    { group = "parakeet" },
  ],
  [
    { extra = "cu126" },
    { extra = "cu128" },
    { extra = "strixhalo" },
  ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchaudio = [
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
# Provider-specific dependency groups
faster-whisper = [
    "faster-whisper>=1.0.0",
    "ctranslate2>=4.0.0",
    "av>=13,<14",
    "nvidia-cublas-cu12>=12.4",
    "nvidia-cudnn-cu12>=9,<10",
]

transformers = [
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "diffusers>=0.30.0",
    "torch>=2.3",
    "torchaudio>=2.3",
]

nemo = [
    "nemo-toolkit[asr]>=2.2.0",
    "cuda-python>=12.3",
    "numpy>=1.26,<2.0",
]

# NeMo for AMD ROCm (Strix Halo / gfx1151) - no cuda-python (CUDA-only binding)
# torch/torchaudio installed via pip in Dockerfile.strixhalo using ROCm nightly index
nemo-rocm = [
    "nemo-toolkit[asr]>=2.2.0",
    "numpy>=1.26,<2.0",
]

vibevoice = [
    "transformers>=5.3.0,<6.0.0",
    "accelerate>=0.30.0",
    "librosa>=0.10.0",
    "torch>=2.3",
    "torchaudio>=2.3",
    "bitsandbytes>=0.46.1",
    "peft>=0.17.0",
    "omegaconf>=2.3.0",
    "wandb>=0.18.0",
]

gemma4 = [
    # 5.10+ ships Gemma4AssistantForCausalLM (MTP drafter) and fixes the 5.5.0
    # audio-conditioned use_cache logits bug that speculative decoding depends on.
    "transformers>=5.10.0,<6.0.0",
    "accelerate>=0.30.0",
    "librosa>=0.10.0",
    "torch>=2.3",
    "torchaudio>=2.3",
    "torchvision>=0.18",
    "pillow>=10.0.0",
    "soundfile>=0.12",
    # 4-bit/8-bit quantization for running Gemma 4 on smaller GPUs.
    "bitsandbytes>=0.46.1",
    # WebSocket backend for the /stream streaming endpoint (uvicorn needs a ws impl).
    "websockets>=13.0",
]

# NVIDIA Audio Flamingo Next (Think variant by default).
# License: NVIDIA OneWay Noncommercial — research use only.
# AF-Next's `audioflamingonext` model_type is not in upstream transformers yet,
# so we install from the in-flight PR fork referenced by the model card.
# Switch to a stable transformers version once the PR lands.
af-next = [
    "transformers @ git+https://github.com/lashahub/transformers.git@205f8c852db63e03c4d05a0e28ceee25f80806da",
    "accelerate>=0.30.0",
    "librosa>=0.10.0",
    "torch>=2.3",
    "torchaudio>=2.3",
    "soundfile>=0.12",
]

# IBM Granite Speech (Granite LLM backbone + conformer speech encoder + LoRA).
# Granite Speech 4.1 requires transformers>=5.8; the built-in LoRA adapter is
# applied via peft at load time.
granite = [
    "transformers>=5.8.0,<6.0.0",
    "accelerate>=0.30.0",
    "peft>=0.17.0",
    "librosa>=0.10.0",
    "soundfile>=0.12",
    "torch>=2.3",
    "torchaudio>=2.3",
]

qwen3-asr = [
    "httpx>=0.28.1",
    "websockets>=13.0",
    "soundfile>=0.12",
]

qwen3-asr-full = [
    "httpx>=0.28.1",
    "websockets>=13.0",
    "soundfile>=0.12",
    "qwen-asr>=0.0.6",
]

# Legacy groups (kept for backward compatibility)
parakeet = [
    "nemo-toolkit[asr]>=2.2.0",
    "cuda-python>=12.3",
    "numpy>=1.26,<2.0",
]

# Development dependencies
dev = [
    "black>=25.1.0",
    "requests>=2.31.0",
    "pytest>=8.0.0",
]

test = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

demo = [
    "fastrtc>=0.0.23",
    "gradio>=5.29.0",
    "sounddevice>=0.5.1",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["common", "providers", "providers.faster_whisper", "providers.transformers", "providers.nemo", "providers.vibevoice", "providers.qwen3_asr", "providers.gemma4", "providers.af_next", "providers.granite"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "asr: requires the containerized ASR service",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["common", "providers"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_empty = true

[tool.coverage.xml]
output = "coverage-reports/coverage.xml"

[tool.coverage.html]
directory = "coverage-reports/html"
