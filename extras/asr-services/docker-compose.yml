# ASR Services Docker Compose
# Provider-based architecture: Run ONE provider at a time with configurable models
#
# Usage:
#   # Start NeMo provider (Parakeet, Canary)
#   ASR_MODEL=nvidia/parakeet-tdt-0.6b-v3 docker compose up nemo-asr -d
#
#   # Start Faster-Whisper provider
#   ASR_MODEL=Systran/faster-whisper-large-v3 docker compose up faster-whisper-asr -d
#
#   # Start Transformers provider (Hindi Whisper, HuggingFace models)
#   ASR_MODEL=openai/whisper-large-v3 docker compose up transformers-asr -d
#
#   # Start VibeVoice provider (speaker diarization)
#   docker compose up vibevoice-asr -d

services:
  # ============================================================================
  # NeMo Provider (Parakeet, Canary, etc.)
  # ============================================================================
  nemo-asr:
    build:
      context: .
      dockerfile: providers/nemo/Dockerfile
      args:
        PYTORCH_CUDA_VERSION: ${PYTORCH_CUDA_VERSION:-cu126}
    image: ${CHRONICLE_REGISTRY:-}chronicle-asr-nemo:${CHRONICLE_TAG:-latest}
    ports:
      - "${ASR_PORT:-8767}:8765"
    volumes:
      - ./model_cache:/models
      - ./debug:/app/debug
      - ./results:/app/results
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - HF_HOME=/models
      - ASR_MODEL=${ASR_MODEL:-nvidia/parakeet-tdt-0.6b-v3}
      # Legacy support
      - PARAKEET_MODEL=${PARAKEET_MODEL:-${ASR_MODEL:-nvidia/parakeet-tdt-0.6b-v3}}
      # Enhanced chunking configuration
      - CHUNKING_ENABLED=${CHUNKING_ENABLED:-true}
      - CHUNK_DURATION_SECONDS=${CHUNK_DURATION_SECONDS:-30.0}
      - OVERLAP_DURATION_SECONDS=${OVERLAP_DURATION_SECONDS:-5.0}
      - MIN_AUDIO_FOR_CHUNKING=${MIN_AUDIO_FOR_CHUNKING:-60.0}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.8}
    restart: unless-stopped

  # ============================================================================
  # Faster-Whisper Provider (4-6x faster Whisper inference)
  # ============================================================================
  faster-whisper-asr:
    build:
      context: .
      dockerfile: providers/faster_whisper/Dockerfile
    image: ${CHRONICLE_REGISTRY:-}chronicle-asr-faster-whisper:${CHRONICLE_TAG:-latest}
    ports:
      - "${ASR_PORT:-8767}:8765"
    volumes:
      - ./model_cache:/models
      - ./debug:/app/debug
      - ./results:/app/results
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - HF_HOME=/models
      - ASR_MODEL=${ASR_MODEL:-Systran/faster-whisper-large-v3}
      - COMPUTE_TYPE=${COMPUTE_TYPE:-float16}
      - DEVICE=${DEVICE:-cuda}
      - DEVICE_INDEX=${DEVICE_INDEX:-0}
      - VAD_FILTER=${VAD_FILTER:-true}
      - LANGUAGE=${LANGUAGE:-}
    restart: unless-stopped

  # ============================================================================
  # VibeVoice Provider (Microsoft VibeVoice-ASR with speaker diarization)
  # Transformers-based approach with speaker diarization support
  # ============================================================================
  vibevoice-asr:
    build:
      context: .
      dockerfile: providers/vibevoice/Dockerfile
      args:
        PYTORCH_CUDA_VERSION: ${PYTORCH_CUDA_VERSION:-cu126}
    image: ${CHRONICLE_REGISTRY:-}chronicle-asr-vibevoice:${CHRONICLE_TAG:-latest}
    ports:
      - "${ASR_PORT:-8767}:8765"
    volumes:
      - ./model_cache:/models
      - ./debug:/app/debug
      - ./results:/app/results
      - ../../config:/app/config:ro
      - ./lora_adapters:/models/lora_adapters
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - HF_HOME=/models
      - ASR_MODEL=${ASR_MODEL:-microsoft/VibeVoice-ASR-HF}
      - VIBEVOICE_ATTN_IMPL=${VIBEVOICE_ATTN_IMPL:-flash_attention_2}
      - DEVICE=${DEVICE:-cuda}
      - TORCH_DTYPE=${TORCH_DTYPE:-bfloat16}
      - MAX_NEW_TOKENS=${MAX_NEW_TOKENS:-8192}
      # Quantization: "none" (default), "8bit", or "4bit". Default is none (full bf16):
      # 4-bit NF4 causes repetition collapse on hard multi-speaker audio (VibeVoice-ASR-7B is
      # trained/evaluated unquantized; bf16 is ~10 WER pts better on CoSHE). Use 8bit/4bit
      # only if VRAM-constrained; the 7B fits in bf16 on a 24GB card.
      - QUANTIZATION=${QUANTIZATION:-none}
      # LoRA adapter: path to pre-trained adapter to auto-load on startup (optional)
      - LORA_ADAPTER_PATH=${LORA_ADAPTER_PATH:-}
      # Fine-tuning
      - FINETUNE_ENABLED=${FINETUNE_ENABLED:-false}
      # Weights & Biases logging (optional)
      - WANDB_ENABLED=${WANDB_ENABLED:-false}
      - WANDB_API_KEY=${WANDB_API_KEY:-}
      - WANDB_PROJECT=${WANDB_PROJECT:-chronicle-asr-finetuning}
      # Batching config: defaults come from config/defaults.yml (asr_services.vibevoice).
      # Override here to force smaller batches for testing stitching on short audio.
      - BATCH_THRESHOLD_SECONDS=${BATCH_THRESHOLD_SECONDS:-}
      - BATCH_DURATION_SECONDS=${BATCH_DURATION_SECONDS:-}
      - BATCH_OVERLAP_SECONDS=${BATCH_OVERLAP_SECONDS:-}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  # ============================================================================
  # Gemma 4 Provider (Google Gemma 4 E4B-it with prompt-based diarization)
  # ============================================================================
  gemma4-asr:
    build:
      context: .
      dockerfile: providers/gemma4/Dockerfile
      args:
        PYTORCH_CUDA_VERSION: ${PYTORCH_CUDA_VERSION:-cu126}
    image: ${CHRONICLE_REGISTRY:-}chronicle-asr-gemma4:${CHRONICLE_TAG:-latest}
    ports:
      - "${ASR_PORT:-8767}:8765"
    volumes:
      - ./model_cache:/models
      - ./debug:/app/debug
      - ./results:/app/results
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - HF_HOME=/models
      # Once the model is cached, run fully offline so startup never depends on
      # DNS/HF reachability. huggingface_hub 1.x (httpx) turns a transient name-
      # resolution failure into a fatal "client has been closed" crash instead of
      # falling back to the local cache. Default 0 so first-run can still download.
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
      - ASR_MODEL=${GEMMA4_MODEL:-google/gemma-4-E4B-it}
      - DEVICE=${DEVICE:-cuda}
      # Gemma4 ~7B-class: stay on bf16 unless explicitly overridden via GEMMA4_TORCH_DTYPE.
      # Don't inherit the global TORCH_DTYPE — that fp16-overflows on Gemma4 the same
      # way it did on AF-Next (see asr_provider_landscape memory).
      - TORCH_DTYPE=${GEMMA4_TORCH_DTYPE:-bfloat16}
      - MAX_NEW_TOKENS=${GEMMA4_MAX_NEW_TOKENS:-512}
      - BATCH_THRESHOLD_SECONDS=${GEMMA4_BATCH_THRESHOLD_SECONDS:-30}
      - BATCH_DURATION_SECONDS=${GEMMA4_BATCH_DURATION_SECONDS:-30}
      - BATCH_OVERLAP_SECONDS=${GEMMA4_BATCH_OVERLAP_SECONDS:-5}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  # ============================================================================
  # NVIDIA Audio Flamingo Next Provider (Think variant by default)
  # Promptable audio LM with timestamped multi-talker diarization.
  # License: NVIDIA OneWay Noncommercial — research use only.
  # Uses ASR_PORT 8767 — alternate to gemma4-asr / vibevoice-asr.
  # ============================================================================
  af-next-asr:
    build:
      context: .
      dockerfile: providers/af_next/Dockerfile
      args:
        PYTORCH_CUDA_VERSION: ${PYTORCH_CUDA_VERSION:-cu126}
    image: ${CHRONICLE_REGISTRY:-}chronicle-asr-af-next:${CHRONICLE_TAG:-latest}
    ports:
      - "${ASR_PORT:-8767}:8765"
    volumes:
      - ./model_cache:/models
      - ./debug:/app/debug
      - ./results:/app/results
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - HF_HOME=/models
      - ASR_MODEL=${AF_NEXT_MODEL:-nvidia/audio-flamingo-next-hf}
      - DEVICE=${DEVICE:-cuda}
      # AF-Next must run bf16: at fp16 a ~7B model overflows and on some inputs
      # the decode collapses into a token-loop ("xtotalzxe xtotaltzxe ..."). The
      # dedicated var keeps a global TORCH_DTYPE=float16 (set for other providers
      # in .env) from leaking in here. ~18-24 GB VRAM at bf16.
      - TORCH_DTYPE=${AF_NEXT_TORCH_DTYPE:-bfloat16}
      - MAX_NEW_TOKENS=${MAX_NEW_TOKENS:-4096}
      # 2-min windows: on longer windows AF-Next drops low-priority opening
      # material (intro montage over music) and slips Devanagari past the
      # romanize instruction; 2 min stays verbatim + Latin. See
      # providers/af_next/transcriber.py for the empirical notes.
      - BATCH_THRESHOLD_SECONDS=${BATCH_THRESHOLD_SECONDS:-120}
      - BATCH_DURATION_SECONDS=${BATCH_DURATION_SECONDS:-100}
      - BATCH_OVERLAP_SECONDS=${BATCH_OVERLAP_SECONDS:-20}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  # ============================================================================
  # Transformers Provider (Hindi Whisper, HuggingFace models)
  # ============================================================================
  transformers-asr:
    build:
      context: .
      dockerfile: providers/transformers/Dockerfile
    image: ${CHRONICLE_REGISTRY:-}chronicle-asr-transformers:${CHRONICLE_TAG:-latest}
    ports:
      - "${ASR_PORT:-8767}:8765"
    volumes:
      - ./model_cache:/models
      - ./debug:/app/debug
      - ./results:/app/results
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - HF_HOME=/models
      - ASR_MODEL=${ASR_MODEL:-openai/whisper-large-v3}
      - USE_FLASH_ATTENTION=${USE_FLASH_ATTENTION:-false}
      - DEVICE=${DEVICE:-cuda}
      - TORCH_DTYPE=${TORCH_DTYPE:-float16}
      - LANGUAGE=${LANGUAGE:-}
    restart: unless-stopped

  # ============================================================================
  # Qwen3-ASR vLLM Server (GPU model serving)
  # ============================================================================
  qwen3-asr:
    build:
      context: .
      dockerfile: providers/qwen3_asr/Dockerfile.vllm
    image: ${CHRONICLE_REGISTRY:-}chronicle-asr-qwen3-vllm:${CHRONICLE_TAG:-latest}
    ports:
      - "${ASR_VLLM_PORT:-8768}:8000"
    volumes:
      - ./model_cache:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - HF_HOME=/models
    command: >
      ${ASR_MODEL:-Qwen/Qwen3-ASR-1.7B}
      --gpu-memory-utilization ${QWEN3_GPU_MEM:-0.8}
      --host 0.0.0.0 --port 8000
      --max-model-len ${QWEN3_MAX_MODEL_LEN:-8192}
    restart: unless-stopped

  # ============================================================================
  # Qwen3-ASR Batch Wrapper (exposes /transcribe on standard ASR port)
  # Uses Dockerfile.full with ForcedAligner for word-level timestamps.
  # Without ForcedAligner, the backend has no words to create segments from.
  # ============================================================================
  qwen3-asr-wrapper:
    build:
      context: .
      dockerfile: providers/qwen3_asr/Dockerfile.full
    image: ${CHRONICLE_REGISTRY:-}chronicle-asr-qwen3-wrapper:${CHRONICLE_TAG:-latest}
    ports:
      - "${ASR_PORT:-8767}:8765"
    volumes:
      - ./model_cache:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - QWEN3_VLLM_URL=http://qwen3-asr:8000
      - ASR_MODEL=${ASR_MODEL:-Qwen/Qwen3-ASR-1.7B}
      - FORCED_ALIGNER_MODEL=${FORCED_ALIGNER_MODEL:-Qwen/Qwen3-ForcedAligner-0.6B}
    depends_on:
      - qwen3-asr
    restart: unless-stopped

  # ============================================================================
  # Qwen3-ASR Streaming Bridge (WebSocket → vLLM SSE)
  # ============================================================================
  qwen3-asr-bridge:
    build:
      context: .
      dockerfile: providers/qwen3_asr/Dockerfile
    image: ${CHRONICLE_REGISTRY:-}chronicle-asr-qwen3-bridge:${CHRONICLE_TAG:-latest}
    ports:
      - "${ASR_STREAM_PORT:-8769}:8766"
    environment:
      - QWEN3_VLLM_URL=http://qwen3-asr:8000
      - ASR_MODEL=${ASR_MODEL:-Qwen/Qwen3-ASR-1.7B}
      - STREAM_INTERVAL_SECONDS=${STREAM_INTERVAL_SECONDS:-3}
    command: ["python", "-m", "providers.qwen3_asr.streaming_bridge", "--port", "8766"]
    depends_on:
      - qwen3-asr
    restart: unless-stopped

  # ============================================================================
  # VibeVoice Provider for AMD Strix Halo (gfx1151 / Ryzen AI Max)
  # Uses ROCm nightly torch wheels; requires /dev/kfd and /dev/dri
  # ============================================================================
  vibevoice-asr-strixhalo:
    build:
      context: .
      dockerfile: providers/vibevoice/Dockerfile.strixhalo
    image: ${CHRONICLE_REGISTRY:-}chronicle-asr-vibevoice-strixhalo:${CHRONICLE_TAG:-latest}
    ports:
      - "${ASR_PORT:-8767}:8765"
    volumes:
      - ./model_cache:/models
      - ./debug:/app/debug
      - ./results:/app/results
      - ../../config:/app/config:ro
      - ./lora_adapters:/models/lora_adapters
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      # Use numeric GIDs - group names (video/render) don't exist in slim Python image.
      # Find your system's GIDs with: getent group video render
      - "${VIDEO_GID:-985}"   # video group (Arch default; Ubuntu typically 44)
      - "${RENDER_GID:-989}"  # render group (Arch default; Ubuntu typically 107)
    environment:
      - HF_HOME=/models
      - ASR_MODEL=${ASR_MODEL:-microsoft/VibeVoice-ASR-HF}
      # sdpa is supported on ROCm; flash_attention_2 requires CUDA
      - VIBEVOICE_ATTN_IMPL=sdpa
      - DEVICE=${VIBEVOICE_DEVICE:-cuda}
      - TORCH_DTYPE=${VIBEVOICE_TORCH_DTYPE:-bfloat16}
      - MAX_NEW_TOKENS=${MAX_NEW_TOKENS:-8192}
      # bitsandbytes quantization requires CUDA - disable for ROCm
      # Strix Halo has lot of unified memory, quantization is not needed
      - QUANTIZATION=
      - LORA_ADAPTER_PATH=${LORA_ADAPTER_PATH:-}
      # Fine-tuning
      - FINETUNE_ENABLED=${FINETUNE_ENABLED:-false}
      # Weights & Biases logging (optional)
      - WANDB_ENABLED=${WANDB_ENABLED:-false}
      - WANDB_API_KEY=${WANDB_API_KEY:-}
      - WANDB_PROJECT=${WANDB_PROJECT:-chronicle-asr-finetuning}
      - HSA_OVERRIDE_GFX_VERSION=11.5.1
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  # ============================================================================
  # NeMo Provider for AMD Strix Halo (gfx1151 / Ryzen AI Max)
  # Uses ROCm nightly torch wheels; requires /dev/kfd and /dev/dri
  # NeMo without cuda-python (CUDA-only binding); ROCm support is experimental
  # ============================================================================
  nemo-asr-strixhalo:
    build:
      context: .
      dockerfile: providers/nemo/Dockerfile.strixhalo
    image: ${CHRONICLE_REGISTRY:-}chronicle-asr-nemo-strixhalo:${CHRONICLE_TAG:-latest}
    ports:
      - "${ASR_PORT:-8767}:8765"
    volumes:
      - ./model_cache:/models
      - ./debug:/app/debug
      - ./results:/app/results
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      # Use numeric GIDs - group names (video/render) don't exist in slim Python image.
      # Find your system's GIDs with: getent group video render
      - "${VIDEO_GID:-985}"   # video group (Arch default; Ubuntu typically 44)
      - "${RENDER_GID:-989}"  # render group (Arch default; Ubuntu typically 107)
    environment:
      - HF_HOME=/models
      - ASR_MODEL=${ASR_MODEL:-nvidia/parakeet-tdt-0.6b-v3}
      # Legacy support
      - PARAKEET_MODEL=${PARAKEET_MODEL:-${ASR_MODEL:-nvidia/parakeet-tdt-0.6b-v3}}
      # Enhanced chunking configuration
      - CHUNKING_ENABLED=${CHUNKING_ENABLED:-true}
      - CHUNK_DURATION_SECONDS=${CHUNK_DURATION_SECONDS:-30.0}
      - OVERLAP_DURATION_SECONDS=${OVERLAP_DURATION_SECONDS:-5.0}
      - MIN_AUDIO_FOR_CHUNKING=${MIN_AUDIO_FOR_CHUNKING:-60.0}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.8}
      - HSA_OVERRIDE_GFX_VERSION=11.5.1
    restart: unless-stopped

  # ============================================================================
  # Legacy Parakeet Service (backward compatibility)
  # ============================================================================
  parakeet-asr:
    build:
      context: .
      dockerfile: Dockerfile_Parakeet
      args:
        PYTORCH_CUDA_VERSION: ${PYTORCH_CUDA_VERSION:-cu126}
    image: parakeet-asr:latest
    ports:
      - "${PARAKEET_HOST_PORT:-8767}:${PARAKEET_CONTAINER_PORT:-8765}"
    volumes:
      - ./model_cache:/models
      - ./debug:/app/debug
      - ./results:/app/results
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - HF_HOME=/models
      - PARAKEET_MODEL=${PARAKEET_MODEL:-nvidia/parakeet-tdt-0.6b-v3}
      # Enhanced chunking configuration
      - CHUNKING_ENABLED=${CHUNKING_ENABLED:-true}
      - CHUNK_DURATION_SECONDS=${CHUNK_DURATION_SECONDS:-30.0}
      - OVERLAP_DURATION_SECONDS=${OVERLAP_DURATION_SECONDS:-5.0}
      - MIN_AUDIO_FOR_CHUNKING=${MIN_AUDIO_FOR_CHUNKING:-60.0}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.8}
    restart: unless-stopped

  # Edge agent sidecar — advertises this service on the Tailnet
  edge-agent:
    build:
      context: ../../edge
    network_mode: host
    environment:
      - ADVERTISE=chronicle-asr:8767
    volumes:
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro
    restart: unless-stopped
    profiles:
      - edge
