services:
  wakeword-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${CHRONICLE_REGISTRY:-}chronicle-wakeword:${CHRONICLE_TAG:-latest}
    container_name: chronicle-wakeword-service
    ports:
      # Host 8771 (8770 is taken by the kittentts service); container stays 8770.
      - "${WAKEWORD_PORT:-8771}:8770"
    environment:
      # Shares the backend's Redis (same chronicle-network).
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # Wake words to run in parallel, as name:file pairs (file under models/).
      # Order = arming priority (lower-FP phrase first). The wake-word NAME is
      # decoupled from the model FILE so a retrained model is swapped without
      # renaming its sample-data dir or plugin condition.
      #   hey_hermes -> hey_hermes_c.onnx (FP-hardened conformer, verifier on top)
      #   hermes     -> hermes.onnx       (single word; FP-prone, higher op-point)
      - WAKEWORD_MODELS=${WAKEWORD_MODELS:-hey_hermes:hey_hermes_f.onnx,hermes:hermes_b.onnx}
      - SMART_TURN_MODEL_PATH=/app/models/smart-turn-v3.2-cpu.onnx
      - SILERO_VAD_MODEL_PATH=/app/models/silero_vad.onnx
      - WAKEWORD_THRESHOLD=${WAKEWORD_THRESHOLD:-0.9}
      - WAKEWORD_PATIENCE=${WAKEWORD_PATIENCE:-2}
      # Per-word operating-point overrides. "hermes" is a single short word with a
      # Per-word operating-point overrides (name:value,...). Since the
      # 2026-06-11 hermes_b retrain (real-data conformer + verifier), "hermes"
      # runs at the shared 0.9/patience-2 point — no overrides needed.
      - WAKEWORD_THRESHOLDS=${WAKEWORD_THRESHOLDS:-}
      - WAKEWORD_PATIENCES=${WAKEWORD_PATIENCES:-}
      # Collect-only (shadow) words fire to farm false-positive review data but
      # never dispatch / play a tone / block a real word. "hermes" went LIVE once
      # its second-stage verifier landed (models/hermes_verifier.npz rejects ~97%
      # of its raw firings, taking it from ~14 FP/hr to <1/hr). Re-add a word here
      # to farm it silently. Empty = all configured words dispatch.
      - WAKEWORD_COLLECT_ONLY=${WAKEWORD_COLLECT_ONLY:-}
      - WAKEWORD_SCORE_LOG=${WAKEWORD_SCORE_LOG:-0}
      - WAKEWORD_DEBOUNCE_SECS=${WAKEWORD_DEBOUNCE_SECS:-3.0}
      - WAKEWORD_VAD_THRESHOLD=${WAKEWORD_VAD_THRESHOLD:-0.5}
      - WAKEWORD_STOP_SECS=${WAKEWORD_STOP_SECS:-2.0}
      - WAKEWORD_MAX_ARM_SECS=${WAKEWORD_MAX_ARM_SECS:-15.0}
      # Second-stage verifiers (FP suppression), auto-enabled per word when
      # models/<name>_verifier.npz exists (hey_hermes has one; hermes will once
      # real clips are labeled). Override paths via WAKEWORD_VERIFIERS=name:path,...
      - WAKEWORD_VERIFIERS=${WAKEWORD_VERIFIERS:-}
      - WAKEWORD_VERIFIER_THRESHOLD=${WAKEWORD_VERIFIER_THRESHOLD:-}
      - WAKEWORD_DATA_DIR=/app/data/samples
      - WAKEWORD_PRIME_TIMEOUT_SECS=${WAKEWORD_PRIME_TIMEOUT_SECS:-12.0}
      - WAKEWORD_PRIME_TRAIL_SILENCE_SECS=${WAKEWORD_PRIME_TRAIL_SILENCE_SECS:-0.6}
      - WAKEWORD_PRIME_MAX_SECS=${WAKEWORD_PRIME_MAX_SECS:-4.0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    # Mount models read-write during dev so a freshly trained hermes.onnx can be
    # dropped in without rebuilding the image. Remove for an immutable image.
    # ./data holds captured wake-word clips (the training flywheel) — persisted
    # on the host so labeled positives/negatives survive rebuilds and feed
    # training/ingest_samples.py directly.
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8770/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  default:
    name: chronicle-network
    external: true
