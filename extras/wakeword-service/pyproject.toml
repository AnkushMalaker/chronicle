[project]
name = "wakeword-service"
version = "0.1.0"
description = "Hermes acoustic wake-word detection service for Chronicle"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "redis>=5.0,<6",
    "numpy>=1.26,<3",
    "onnxruntime>=1.20,<2",
    # nanowakeword runtime (interpreter only — no train extras in the image)
    "nanowakeword>=2.1,<3",
    # pipecat provides Silero VAD + Smart Turn v3 (standalone analyzers).
    # Pinned to the tested release (PyPI tops out at 0.0.x; bundles smart-turn-v3.2).
    "pipecat-ai==0.0.108",
    "soxr>=0.5,<2",
]

[dependency-groups]
test = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# nanowakeword (==2.1.4) and pipecat-ai are pulled from PyPI — the repo's
# untracked/ copies are pristine at those tags, so PyPI matches. The exact
# Smart Turn v3.2 + Silero VAD ONNX files are vendored into models/ at build
# time (vendor_models.sh) so the runtime never depends on a PyPI re-bundle.

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88
