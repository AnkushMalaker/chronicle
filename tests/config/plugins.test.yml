# Test plugin configuration for integration testing
# This file is loaded during tests to verify event dispatch system

plugins:
  test_event:
    enabled: true
    events:
      - transcript.streaming
      - transcript.batch
      - conversation.complete
      - memory.processed
    condition:
      type: always  # Capture all events without filtering
    db_path: /app/debug/test_plugin_events.db

  button_control:
    enabled: true
    events:
      - button.single_press
      - button.double_press
    condition:
      type: always
    # NOTE: only enabled/events/condition are read from this file (orchestration).
    # Button->action mapping comes from plugins/button_control/config.yml:
    #   single_press -> stop_playback, double_press -> close_conversation
