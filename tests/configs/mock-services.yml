chat:
  system_prompt: You are a helpful AI assistant with access to the user's personal
    memories and conversation history.
defaults:
  embedding: mock-embed
  # Without a fallback the memory agent's note-guarantee recovery pass
  # (force_fallback=True) raises "No fallback LLM is configured" and the whole
  # memory job fails before the source-preserving fallback note can be written.
  # Must be a DIFFERENT model name than defaults.llm — a fallback identical to
  # the primary is rejected as pointless (llm_client._get_fallback_model_def).
  fallback_llm: mock-llm-fallback
  llm: mock-llm
  stt: mock-stt
  stt_stream: mock-stt-stream
memory:
  extraction:
    enabled: true
    prompt: ''
  provider: chronicle
  timeout_seconds: 1200
models:
- api_family: openai
  api_key: dummy-key-not-used
  description: Mock LLM server for testing (local)
  model_name: gpt-4o-mini
  model_output: json
  model_params:
    max_tokens: 2000
    temperature: 0.2
  model_provider: openai
  model_type: llm
  model_url: http://host.docker.internal:11435/v1
  name: mock-llm
- api_family: openai
  api_key: dummy-key-not-used
  description: Same mock LLM server under a distinct name, so it passes the
    fallback!=primary check and the recovery pass actually runs in tests
  model_name: gpt-4o-mini
  model_output: json
  model_params:
    max_tokens: 2000
    temperature: 0.2
  model_provider: openai
  model_type: llm
  model_url: http://host.docker.internal:11435/v1
  name: mock-llm-fallback
- api_family: openai
  api_key: dummy-key-not-used
  description: Mock embedding server for testing (local)
  embedding_dimensions: 1536
  model_name: text-embedding-3-small
  model_output: vector
  model_provider: openai
  model_type: embedding
  model_url: http://host.docker.internal:11435/v1
  name: mock-embed
- api_family: mock
  api_key: mock-key-not-used
  description: Mock STT for testing (batch)
  model_provider: mock
  model_type: stt
  model_url: http://host.docker.internal:9999
  name: mock-stt
  operations:
    stt_transcribe:
      headers:
        Content-Type: audio/raw
      method: POST
      path: /transcribe
      response:
        extract:
          text: text
          words: words
          segments: segments
        type: json
- api_family: mock
  api_key: mock-key-not-used
  description: Mock STT for testing (streaming)
  model_provider: mock
  model_type: stt_stream
  model_url: ws://host.docker.internal:9999
  name: mock-stt-stream
  operations:
    chunk_header:
      message: {}
    end:
      message:
        type: CloseStream
    expect:
      extract:
        text: channel.alternatives[0].transcript
        words: channel.alternatives[0].words
        segments: []
      final_type: Results
      interim_type: Results
    start:
      message: {}
backend:
  diarization:
    # Trust provider segments (mock provider returns pre-built segments)
    diarization_source: provider
speaker_recognition:
  enabled: false
  timeout: 60
