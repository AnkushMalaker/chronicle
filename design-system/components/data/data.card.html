<!-- @dsCard group="Components" viewport="700x300" name="Data — hub cards, collapsible" subtitle="Launcher tiles and lazy expanders" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>body{margin:0;background:var(--surface-raised);color:var(--text-primary);font-family:var(--font-sans);padding:20px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.Chronicle || Object.values(window).find(v => v && v.HubCard) || {}
const { HubCard, CollapsibleSection } = NS
const I = (n,s=20) => React.createElement('span',{ref:e=>{if(e){e.innerHTML='';const i=document.createElement('i');i.setAttribute('data-lucide',n);e.appendChild(i);window.lucide&&window.lucide.createIcons()}},style:{display:'inline-flex'}})
ReactDOM.createRoot(document.getElementById('root')).render(
  <div style={{display:'flex',flexDirection:'column',gap:14}}>
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14}}>
      <HubCard icon={I('sparkles')} title="Audit conversations" stat="468" description="Find speech-free or mis-attributed audio; split, merge, archive."/>
      <HubCard icon={I('mic')} title="Enroll speakers" description="Review the relabel queue and strengthen voiceprints — deliberate, gated."/>
      <HubCard icon={I('target')} title="Wake-Word Lab" description="Review false positives & capture wake clips." cta={<>Open lab {I('arrow-right')}</>} active onClick={()=>{}}/>
    </div>
    <CollapsibleSection icon={I('gauge',16)} title="Speaker identification confidence" meta="2048/11625 (17.6%) low-confidence">
      <div style={{fontSize:13,color:'var(--text-muted)'}}>Threshold in use 0.35 · recommended 0.42 · 11625 identifications</div>
    </CollapsibleSection>
  </div>)
</script></body></html>
