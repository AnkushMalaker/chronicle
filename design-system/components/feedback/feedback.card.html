<!-- @dsCard group="Components" viewport="700x230" name="Feedback — alert, modal" subtitle="Inline banners and the confirm dialog" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>body{margin:0;background:var(--surface-raised);color:var(--text-primary);font-family:var(--font-sans);padding:20px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.Chronicle || Object.values(window).find(v => v && v.Alert && v.Modal) || {}
const { Alert, Modal, Button } = NS
const I = (n,s=16) => React.createElement('span',{ref:e=>{if(e){e.innerHTML='';const i=document.createElement('i');i.setAttribute('data-lucide',n);e.appendChild(i);window.lucide&&window.lucide.createIcons()}},style:{display:'inline-flex'}})
function Demo(){ const [o,setO]=React.useState(false)
  return <div style={{display:'flex',flexDirection:'column',gap:10,maxWidth:560}}>
    <Alert tone="info">Analyzing audio… 42/468</Alert>
    <Alert tone="success">Analysis complete</Alert>
    <Alert tone="warning" icon={I('alert-triangle')}>Showing a capped working set — narrow filters.</Alert>
    <Alert tone="danger" icon={I('alert-triangle')}>Wake-word service unreachable</Alert>
    <div><Button variant="secondary" onClick={()=>setO(true)}>Open confirm dialog</Button></div>
    <Modal open={o} onClose={()=>setO(false)} title="Permanently delete audio for 12 conversation(s)?" icon={I('alert-triangle')}
      footer={<><Button variant="ghost" onClick={()=>setO(false)}>Cancel</Button><Button variant="danger">Delete audio</Button></>}>
      The audio bytes will be deleted to reclaim storage. A metadata stub is kept. This cannot be undone.
    </Modal>
  </div> }
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>)
</script></body></html>
