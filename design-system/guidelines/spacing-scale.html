<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing scale" subtitle="4px base grid; layout uses flex/grid gap" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);background:var(--surface-raised);color:var(--text-primary);padding:18px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.sw{border-radius:var(--radius-lg);border:1px solid var(--border);height:52px;width:96px;display:flex;align-items:flex-end;padding:6px;font:500 10px/1 var(--font-mono);color:var(--text-secondary)}.lbl{font:500 11px/1.3 var(--font-mono);color:var(--text-muted)}.chip{display:inline-flex;align-items:center;gap:4px;padding:var(--pad-chip);border-radius:var(--radius-sm);font-size:var(--text-xs)}</style></head><body><div style="display:flex;flex-direction:column;gap:7px">
<div style="display:flex;align-items:center;gap:10px"><div class="lbl" style="width:120px">--space-1 · 4px</div><div style="height:12px;width:4px;background:var(--accent)"></div></div><div style="display:flex;align-items:center;gap:10px"><div class="lbl" style="width:120px">--space-2 · 8px</div><div style="height:12px;width:8px;background:var(--accent)"></div></div><div style="display:flex;align-items:center;gap:10px"><div class="lbl" style="width:120px">--space-3 · 12px</div><div style="height:12px;width:12px;background:var(--accent)"></div></div><div style="display:flex;align-items:center;gap:10px"><div class="lbl" style="width:120px">--space-4 · 16px</div><div style="height:12px;width:16px;background:var(--accent)"></div></div><div style="display:flex;align-items:center;gap:10px"><div class="lbl" style="width:120px">--space-6 · 24px</div><div style="height:12px;width:24px;background:var(--accent)"></div></div><div style="display:flex;align-items:center;gap:10px"><div class="lbl" style="width:120px">--space-8 · 32px</div><div style="height:12px;width:32px;background:var(--accent)"></div></div><div style="display:flex;align-items:center;gap:10px"><div class="lbl" style="width:120px">--space-10 · 40px</div><div style="height:12px;width:40px;background:var(--accent)"></div></div>
</div></body></html>
