<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);background:var(--surface-raised);color:var(--text-primary);padding:18px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.sw{border-radius:var(--radius-lg);border:1px solid var(--border);height:52px;width:96px;display:flex;align-items:flex-end;padding:6px;font:500 10px/1 var(--font-mono);color:var(--text-secondary)}.lbl{font:500 11px/1.3 var(--font-mono);color:var(--text-muted)}.chip{display:inline-flex;align-items:center;gap:4px;padding:var(--pad-chip);border-radius:var(--radius-sm);font-size:var(--text-xs)}</style></head><body><div class="row">
<div><div class="sw" style="background:var(--blue-900);color:#fff">900</div><div class="lbl">--blue-900</div></div><div><div class="sw" style="background:var(--blue-700);color:#fff">700</div><div class="lbl">--blue-700</div></div><div><div class="sw" style="background:var(--blue-600);color:#fff">600</div><div class="lbl">--blue-600</div></div><div><div class="sw" style="background:var(--blue-500);color:#fff">500</div><div class="lbl">--blue-500</div></div><div><div class="sw" style="background:var(--blue-400);color:#fff">400</div><div class="lbl">--blue-400</div></div><div><div class="sw" style="background:var(--blue-300);color:#fff">300</div><div class="lbl">--blue-300</div></div>
</div><div class="row" style="margin-top:10px"><span class="chip" style="background:var(--accent);color:#fff">accent · primary</span><span class="chip" style="background:var(--accent-nav-bg);color:var(--blue-300)">accent-nav-bg</span><span style="color:var(--accent-fg)">accent-fg text</span></div></body></html>
