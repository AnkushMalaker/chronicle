<!-- @dsCard group="Colors" viewport="700x160" name="Status chips" subtitle="Soft translucent fills for verifier / errors / warnings / info / suggestions" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);background:var(--surface-raised);color:var(--text-primary);padding:18px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.sw{border-radius:var(--radius-lg);border:1px solid var(--border);height:52px;width:96px;display:flex;align-items:flex-end;padding:6px;font:500 10px/1 var(--font-mono);color:var(--text-secondary)}.lbl{font:500 11px/1.3 var(--font-mono);color:var(--text-muted)}.chip{display:inline-flex;align-items:center;gap:4px;padding:var(--pad-chip);border-radius:var(--radius-sm);font-size:var(--text-xs)}</style></head><body><div class="row">
<span class="chip" style="background:var(--success-soft-bg);color:var(--success-fg)">verifier on</span>
<span class="chip" style="background:var(--danger-soft-bg);color:var(--danger-fg)">not / error</span>
<span class="chip" style="background:var(--warning-soft-bg);color:var(--warning-fg)">collect-only</span>
<span class="chip" style="background:var(--info-soft-bg);color:var(--info-fg)">missed</span>
<span class="chip" style="background:var(--suggest-soft-bg);color:var(--suggest-fg)">also fired</span>
<span class="chip" style="background:var(--chip-bg);color:var(--chip-fg)">neutral</span>
</div>
<div class="lbl" style="margin-top:12px">--{success,danger,warning,info,suggest}-soft-bg + matching -fg · --chip-bg/-fg</div></body></html>
