<!-- @dsCard group="Colors" viewport="700x150" name="Text tones" subtitle="Four text weights on a raised surface" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);background:var(--surface-raised);color:var(--text-primary);padding:18px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.sw{border-radius:var(--radius-lg);border:1px solid var(--border);height:52px;width:96px;display:flex;align-items:flex-end;padding:6px;font:500 10px/1 var(--font-mono);color:var(--text-secondary)}.lbl{font:500 11px/1.3 var(--font-mono);color:var(--text-muted)}.chip{display:inline-flex;align-items:center;gap:4px;padding:var(--pad-chip);border-radius:var(--radius-sm);font-size:var(--text-xs)}</style></head><body><div style="display:flex;flex-direction:column;gap:6px">
<div style="color:var(--text-primary);font-size:18px;font-weight:600">Primary — headings & key values <span class="lbl">--text-primary</span></div>
<div style="color:var(--text-secondary);font-size:14px">Secondary — body & button labels <span class="lbl">--text-secondary</span></div>
<div style="color:var(--text-muted);font-size:14px">Muted — descriptions & captions <span class="lbl">--text-muted</span></div>
<div style="color:var(--text-faint);font-size:13px">Faint — metadata & hints <span class="lbl">--text-faint</span></div>
</div></body></html>
