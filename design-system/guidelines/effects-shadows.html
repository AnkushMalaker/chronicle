<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);background:var(--surface-raised);color:var(--text-primary);padding:18px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.sw{border-radius:var(--radius-lg);border:1px solid var(--border);height:52px;width:96px;display:flex;align-items:flex-end;padding:6px;font:500 10px/1 var(--font-mono);color:var(--text-secondary)}.lbl{font:500 11px/1.3 var(--font-mono);color:var(--text-muted)}.chip{display:inline-flex;align-items:center;gap:4px;padding:var(--pad-chip);border-radius:var(--radius-sm);font-size:var(--text-xs)}</style></head><body><div class="row" style="gap:22px;padding:14px 4px">
<div style="text-align:center"><div style="height:56px;width:100px;background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)"></div><div class="lbl" style="margin-top:10px">--shadow-sm<br>card</div></div><div style="text-align:center"><div style="height:56px;width:100px;background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)"></div><div class="lbl" style="margin-top:10px">--shadow-lg<br>modal</div></div><div style="text-align:center"><div style="height:56px;width:100px;background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-pill)"></div><div class="lbl" style="margin-top:10px">--shadow-pill<br>float</div></div><div style="text-align:center"><div style="height:56px;width:100px;background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-menu)"></div><div class="lbl" style="margin-top:10px">--shadow-menu<br>dropdown</div></div>
</div></body></html>
