<!-- @dsCard group="Type" viewport="700x230" name="Type scale" subtitle="system-ui; Tailwind default ramp xs → 3xl" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);background:var(--surface-raised);color:var(--text-primary);padding:18px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.sw{border-radius:var(--radius-lg);border:1px solid var(--border);height:52px;width:96px;display:flex;align-items:flex-end;padding:6px;font:500 10px/1 var(--font-mono);color:var(--text-secondary)}.lbl{font:500 11px/1.3 var(--font-mono);color:var(--text-muted)}.chip{display:inline-flex;align-items:center;gap:4px;padding:var(--pad-chip);border-radius:var(--radius-sm);font-size:var(--text-xs)}</style></head><body><div style="display:flex;flex-direction:column;gap:4px">
<div style="font-size:var(--text-3xl);font-weight:700;letter-spacing:var(--tracking-tight)">3xl / 30 — page title</div>
<div style="font-size:var(--text-2xl);font-weight:700">2xl / 24 — view heading</div>
<div style="font-size:var(--text-xl);font-weight:600">xl / 20 — section</div>
<div style="font-size:var(--text-lg);font-weight:600">lg / 18 — card title</div>
<div style="font-size:var(--text-base)">base / 16 — body</div>
<div style="font-size:var(--text-sm);color:var(--text-secondary)">sm / 14 — UI default & labels</div>
<div style="font-size:var(--text-xs);color:var(--text-muted)">xs / 12 — captions & metadata</div>
</div></body></html>
